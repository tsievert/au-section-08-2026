name: Render and publish Quarto presentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # If your qmd uses R code, uncomment this:
      # - name: Set up R
      #   uses: r-lib/actions/setup-r@v2

      # If your qmd needs R packages, add installation here.
      # Example:
      # - name: Install R packages
      #   run: |
      #     Rscript -e 'install.packages(c("tidyverse", "knitr", "rmarkdown"), repos = "https://cloud.r-project.org")'

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}